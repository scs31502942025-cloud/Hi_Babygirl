<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A question for you 💕</title>

<!--
  ╔══════════════════════════════════════════════════════════════╗
  ║  🎵 WHERE TO ADD YOUR SONG                                    ║
  ║                                                              ║
  ║  1. Put your audio file in the SAME folder as this file.     ║
  ║  2. Name it  love.mp3   (or change SONG_FILE in the script   ║
  ║     near the bottom of this page to match your file name).   ║
  ║  3. Commit both files to your repo. Done!                    ║
  ╚══════════════════════════════════════════════════════════════╝
-->

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    font-family: "Segoe UI", system-ui, -apple-system, "Noto Sans", sans-serif;
  }

  /* ---------- SCENE 1: the cute question ---------- */
  #question-scene {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #ffd6e8 0%, #ffb3d1 45%, #ff9ec4 100%);
    transition: opacity 1.2s ease;
    z-index: 2;
  }
  #question-scene.fade-out { opacity: 0; pointer-events: none; }

  .floaty {
    position: absolute;
    bottom: -60px;
    user-select: none;
    pointer-events: none;
    animation: floatUp linear infinite;
    opacity: .85;
  }
  @keyframes floatUp {
    0%   { transform: translateY(0) rotate(0deg); }
    50%  { transform: translateY(-60vh) rotate(18deg); }
    100% { transform: translateY(-120vh) rotate(-12deg); }
  }

  .card {
    position: relative; z-index: 3;
    text-align: center;
    padding: 36px 28px;
    max-width: 92vw;
  }
  .card h1 {
    font-size: clamp(2rem, 7vw, 4rem);
    color: #c2185b;
    text-shadow: 0 3px 0 #fff, 0 6px 18px rgba(194,24,91,.25);
    margin-bottom: 34px;
    animation: bob 2.4s ease-in-out infinite;
  }
  @keyframes bob { 50% { transform: translateY(-8px); } }

  .buttons { display: flex; gap: 18px; justify-content: center; flex-wrap: wrap; }

  .btn {
    font-size: clamp(1.1rem, 4vw, 1.6rem);
    font-weight: 700;
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 16px 38px;
    cursor: pointer;
    background: linear-gradient(135deg, #ff6fa5, #ff3d86);
    box-shadow: 0 8px 20px rgba(255, 61, 134, .4), inset 0 -3px 0 rgba(0,0,0,.08);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .btn:nth-child(2) { background: linear-gradient(135deg, #ff8fb8, #ff5a9c); }
  .btn:hover  { transform: scale(1.08) rotate(-1.5deg); box-shadow: 0 12px 26px rgba(255, 61, 134, .5); }
  .btn:active { transform: scale(.96); }

  /* ---------- SCENE 2: the heart of words ---------- */
  #heart-scene {
    position: fixed; inset: 0;
    background: #000;
    z-index: 1;
    opacity: 0;
    transition: opacity 1.2s ease;
    --word-color: #ff1f3d;
  }
  #heart-scene.show { opacity: 1; z-index: 3; }

  .word {
    position: absolute;
    white-space: nowrap;
    transform: translate(-50%, -50%);
    color: var(--word-color);
    font-weight: 600;
    opacity: 0;
    animation: pop 1.1s ease forwards;
    transition: color .6s ease;
    text-shadow: 0 0 6px currentColor;
  }
  /* newly appearing words flash pink, then settle into the current colour */
  @keyframes pop {
    0%   { opacity: 0; color: #ff9ad0; transform: translate(-50%, -50%) scale(.4); }
    40%  { opacity: 1; color: #ffc2e2; transform: translate(-50%, -50%) scale(1.25); }
    100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  }

  /* once the heart is finished: steady red + a gentle heartbeat */
  #heart-scene.done .word { color: #ff1f3d; }
  #heart-scene.done #heart-wrap { animation: beat 1.4s ease-in-out infinite; }
  @keyframes beat {
    0%, 100% { transform: scale(1); }
    15%      { transform: scale(1.04); }
    30%      { transform: scale(1); }
    45%      { transform: scale(1.03); }
  }

  /* big English intro that zooms in before the heart forms */
  #intro {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    pointer-events: none;
    font-size: clamp(3.2rem, 15vw, 10rem);
    font-weight: 800;
    letter-spacing: .02em;
    color: #ff1f3d;
    text-shadow: 0 0 24px rgba(255, 31, 61, .7);
    opacity: 0;
  }
  /* big "I love you" fades in, holds, then SHRINKS into the first spot of the heart */
  #intro.play { animation: introShrink 5.5s ease-in-out forwards, introColor 1s steps(1) infinite; }
  @keyframes introShrink {
    0%   { opacity: 0; transform: translate(0,0) scale(.6); }
    18%  { opacity: 1; transform: translate(0,0) scale(1.1); }
    50%  { opacity: 1; transform: translate(0,0) scale(1); }
    100% { opacity: 1; transform: translate(var(--dx), var(--dy)) scale(var(--ds)); }
  }
  @keyframes introColor {
    0%   { color: #ff1f3d; }
    50%  { color: #ff8fc7; }
  }
  #heart-wrap { position: absolute; inset: 0; transform-origin: center; }
</style>
</head>
<body>

<!-- Scene 1 -->
<div id="question-scene">
  <div class="card">
    <h1>Do you love me? 💖</h1>
    <div class="buttons">
      <button class="btn" id="yes1">Yes 💗</button>
      <button class="btn" id="yes2">Yes, obviously 🥰</button>
    </div>
  </div>
</div>

<!-- Scene 2 -->
<div id="heart-scene">
  <div id="intro">I love you</div>
  <div id="heart-wrap"></div>
</div>

<!-- 🎵 YOUR SONG LIVES HERE (see the SONG_FILE setting in the script below) -->
<audio id="song" loop preload="auto"></audio>

<script>
/* ============================================================
   SETTINGS: tweak these freely
   ============================================================ */
const SONG_FILE   = "love.mp3";  // 🎵 <-- put your song's file name here
const OUTLINE_DELAY = 350;       // ms between words while the OUTLINE is traced (lower = faster)
const FILL_DELAY    = 180;       // ms between words while the INSIDE fills in
const FLASH_SPEED = 700;         // ms between red <-> pink flashes while building
const INTRO_MS    = 5500;        // how long the big "I love you" lasts before the heart starts

const PHRASES = [
  "I love you","Te amo","Je t'aime","Ich liebe dich","Ti amo","Eu te amo",
  "Ik hou van je","Jag älskar dig","Jeg elsker deg","Jeg elsker dig","Rakastan sinua",
  "Kocham cię","Я тебя люблю","Я тебе кохаю","我爱你","愛してる","사랑해",
  "Aku cinta kamu","Mahal kita","Anh yêu em","ผมรักคุณ","Seni seviyorum",
  "Σ' αγαπώ","אני אוהב אותך","أحبك","دوستت دارم","मैं तुमसे प्यार करता हूँ",
  "আমি তোমাকে ভালোবাসি","நான் உன்னை காதலிக்கிறேன்","مجھے تم سے محبت ہے",
  "Nakupenda","Ninakupenda","Ngiyakuthanda","Ek is lief vir jou","Mo nífẹ̀ẹ́ rẹ",
  "Ina son ka","እወድሻለሁ","Waan ku jeclahay","Szeretlek","Miluji tě","Te iubesc",
  "Volim te","Ég elska þig","Saya cintakan awak","T'estimo","Aloha au iā ʻoe",
  "Aroha ahau ki a koe","Tá grá agam duit","Rwy'n dy garu di","Mīlu tevi","Aš tave myliu",
  "Armastan sind","Ľúbim ťa","Ljubim te","Të dua","Ես սիրում եմ քեզ","Მიყვარხარ"
];

// Most widely spoken / best known languages come first, everything else follows.
const FAMOUS = [
  "I love you","Je t'aime","Ti amo","Ich liebe dich","Te amo","Eu te amo",
  "我爱你","愛してる","사랑해","Я тебя люблю","أحبك","मैं तुमसे प्यार करता हूँ",
  "Seni seviyorum","Ik hou van je","Nakupenda"
];
const ORDER = FAMOUS.concat(PHRASES.filter(p => !FAMOUS.includes(p)));

/* ============================================================
   SCENE 1: floating puppies & hearts
   ============================================================ */
const EMOJIS = ["🐶","🐩","🐕","🐾","🐶","💗","💖","💕","💞","🌸","🐕‍🦺","🧸"];
const qScene = document.getElementById("question-scene");

for (let i = 0; i < 38; i++) {
  const el = document.createElement("div");
  el.className = "floaty";
  el.textContent = EMOJIS[Math.floor(Math.random() * EMOJIS.length)];
  el.style.left = Math.random() * 100 + "vw";
  el.style.fontSize = (22 + Math.random() * 44) + "px";
  el.style.animationDuration = (9 + Math.random() * 12) + "s";
  el.style.animationDelay = (-Math.random() * 20) + "s";   // start already mid-air
  qScene.appendChild(el);
}

/* ============================================================
   SCENE 2: build the heart out of words
   ============================================================ */
const heartScene = document.getElementById("heart-scene");
const wrap = document.getElementById("heart-wrap");
const song = document.getElementById("song");

// implicit heart curve: inside when value <= 0
const insideHeart = (u, v) => Math.pow(u*u + v*v - 1, 3) - u*u * Math.pow(v, 3) <= 0;

function layoutWords() {
  const W = window.innerWidth, H = window.innerHeight;
  const scale = Math.min(W / 2.5, (H * 0.88) / 2.3);
  const fs = Math.max(10, Math.min(22, scale / 15));      // font size
  const rowH = fs * 1.38;
  const padY = fs * 0.55;
  const gap = fs * 0.7;
  const toUV = (px, py) => [ (px - W/2) / scale, (H/2 - py) / scale + 0.12 ];
  const inside = (px, py) => { const [u, v] = toUV(px, py); return insideHeart(u, v); };
  const fits = (x, y) => inside(x, y - padY) && inside(x, y) && inside(x, y + padY);

  const probe = document.createElement("span");
  probe.className = "word";
  probe.style.cssText = `font-size:${fs}px;visibility:hidden;animation:none`;
  wrap.appendChild(probe);
  const measure = t => { probe.textContent = t; return probe.getBoundingClientRect().width; };

  const PW = PHRASES.map(measure);
  const heartW = measure("♥");
  const placed = [];
  let n = Math.floor(Math.random() * PHRASES.length);

  const top = H/2 - scale * 1.2, bottom = H/2 + scale * 1.05;
  for (let y = top; y <= bottom; y += rowH) {

    // 1. find every stretch of this row that sits fully inside the heart
    //    (the top of the heart has two stretches, one per lobe)
    const runs = [];
    let start = null;
    const x0 = W/2 - scale * 1.3, x1 = W/2 + scale * 1.3;
    for (let x = x0; x <= x1; x += 2) {
      if (fits(x, y)) { if (start === null) start = x; }
      else if (start !== null) { runs.push([start, x - 2]); start = null; }
    }
    if (start !== null) runs.push([start, x1]);

    // 2. fill each stretch edge to edge
    for (const [a0, b0] of runs) {
      const a = a0 + 2, b = b0 - 2;
      const run = { a, b };
      const width = b - a;
      if (width < heartW) continue;

      const items = [];                 // {text, w}
      let rem = width;
      while (true) {
        const need = items.length ? gap : 0;
        const cand = [];
        for (let i = 0; i < PHRASES.length; i++) if (PW[i] + need <= rem) cand.push(i);
        if (!cand.length) break;
        const next = n % PHRASES.length;
        const pick = (PW[next] + need <= rem) ? next : cand[Math.floor(Math.random() * cand.length)];
        n++;
        items.push({ text: PHRASES[pick], w: PW[pick] });
        rem -= PW[pick] + need;
      }
      if (!items.length) continue;

      // 3. spread the leftover space evenly so the row hugs both edges
      let extra = 0, x = a;
      if (items.length > 1) extra = rem / (items.length - 1);
      else x = a + rem / 2;
      items.forEach((it, idx) => {
        const cx = x + it.w / 2;
        const [u, v] = toUV(cx, y);
        const up = y - rowH * 0.95, dn = y + rowH * 0.95;
        // a word is on the outline if it ends its row, or has empty space above/below it
        const edge = idx === 0 || idx === items.length - 1 ||
          !inside(x, up) || !inside(cx, up) || !inside(x + it.w, up) ||
          !inside(x, dn) || !inside(cx, dn) || !inside(x + it.w, dn);
        // clockwise angle: 0 at the top dip, going right, down, round the left, back up
        const ang = (Math.atan2(u, v - 0.15) + 2 * Math.PI) % (2 * Math.PI);
        placed.push({ text: it.text, x: cx, y, fs, edge, ang, w: it.w, run });
        x += it.w + gap + extra;
      });
    }
  }
  placed.PWmap = {};
  PHRASES.forEach((t, i) => placed.PWmap[t] = PW[i]);
  placed.fs = fs; placed.gap = gap; placed.emojiW = measure("❤️");
  probe.remove();
  return placed;
}

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

const HEART_EMOJIS = ["❤️","💖","💗","💕","💞","💘"];
const EMOJI_COUNT = 15;   // how many heart emojis are scattered through the heart

// give each slot a phrase in BUILD order (most famous languages first), then re-space the rows
function assignPhrases(seq, all) {
  const PWm = all.PWmap, fs = all.fs, gap = all.gap, emojiW = all.emojiW;
  const fit = (t, w) => PWm[t] <= w;

  // 1) English always goes first: use the first outline spot wide enough for it
  const e0 = seq.findIndex(sl => fit(ORDER[0], sl.w));
  if (e0 > 0) seq.unshift(seq.splice(e0, 1)[0]);

  // 2) words: walk the build order, always taking the best-fitting phrase among the most famous ones left
  let pool = ORDER.slice();
  for (const slot of seq) {
    if (slot.emoji) continue;
    let k = (slot === seq[0] && fit(pool[0], slot.w)) ? 0 : -1;
    for (let tries = 0; tries < 1 && k === -1; tries++) {
      const win = Math.min(3, pool.length);
      let best = -1;
      for (let i = 0; i < pool.length; i++) {
        if (i === win && best >= 0) break;            // a famous one fits: don't look further down the list
        if (fit(pool[i], slot.w) && (best < 0 || PWm[pool[i]] > PWm[pool[best]] || i >= win)) {
          if (i >= win && best >= 0) break;
          best = i;
        }
      }
      k = best;
      if (k < 0) {                    // nothing left in this round fits this narrow spot:
        const t = ORDER.filter(x => fit(x, slot.w)).sort((p, q) => PWm[q] - PWm[p])[0];
        if (t) { slot.text = t; slot.w = PWm[t]; k = -2; }   // borrow the widest phrase that fits, keep the round intact
      }
    }
    if (k === -2) continue;
    if (k < 0) { slot.drop = true; continue; }
    slot.text = pool[k]; slot.w = PWm[pool[k]];
    pool.splice(k, 1);
    if (!pool.length) pool = ORDER.slice();
  }
  const kept = seq.filter(s => !s.drop);

  // 3) group the words by row stretch
  const runs = new Map();
  for (const w of kept) { if (!runs.has(w.run)) runs.set(w.run, []); runs.get(w.run).push(w); }
  const rows = [...runs.values()].map(items => { items.sort((p, q) => p.x - q.x); return items; });
  const CAP = 0.05 * fs;                                   // letters can tighten a little to make room
  const room = items => {
    const chars = items.reduce((t, w) => t + [...w.text].length, 0);
    const sum = items.reduce((t, w) => t + w.w, 0);
    return (items[0].run.b - items[0].run.a) - sum - gap * (items.length - 1) + CAP * chars;
  };

  // 4) ~15 heart emojis: random rows that have a little spare room, spread apart, at random spots
  const cand = shuffle(rows.filter(r => room(r) >= emojiW + gap));
  const picked = [];
  for (const d of [12, 8, 5, 3, 0]) {
    for (const r of cand) {
      if (picked.length >= EMOJI_COUNT) break;
      if (picked.includes(r)) continue;
      if (picked.every(o => Math.hypot(o[0].x - r[0].x, o[0].y - r[0].y) > d * fs)) picked.push(r);
    }
  }
  const hearts = [];
  for (const r of picked) {
    const at = r.length > 1 ? 1 + Math.floor(Math.random() * (r.length - 1)) : 1;
    const x = r.length > 1 ? (r[at - 1].x + r[at].x) / 2 : r[0].x + 1;
    const h = { text: HEART_EMOJIS[Math.floor(Math.random() * HEART_EMOJIS.length)], emoji: true,
                w: emojiW, x, y: r[0].y, fs: r[0].fs, edge: false, run: r[0].run };
    r.splice(at, 0, h);
    hearts.push(h);
  }

  // 5) re-space every row so it stays packed edge to edge
  for (const items of rows) {
    const run = items[0].run;
    const words = items.filter(w => !w.emoji);
    const chars = words.reduce((t, w) => t + [...w.text].length, 0);
    const n = items.length;
    let sum = items.reduce((t, w) => t + w.w, 0);
    if (n > 1 && chars) {                                  // stretch (or tighten) letters so no row looks sparse
      const ls = Math.max(-CAP, Math.min(0.18 * fs, (run.b - run.a - sum - gap * (n - 1)) / chars));
      for (const w of words) { w.ls = ls; w.w += ls * [...w.text].length; }
      sum = items.reduce((t, w) => t + w.w, 0);
    }
    const space = n > 1 ? (run.b - run.a - sum) / (n - 1) : 0;
    let x = n > 1 ? run.a : run.a + (run.b - run.a - sum) / 2;
    for (const w of items) { w.x = x + w.w / 2; x += w.w + space; }
  }

  // 6) final order: outline first, then the body top to bottom, with each heart popping in at a random moment
  const outlinePart = kept.filter(w => w.edge);
  const innerPart = kept.filter(w => !w.edge);
  for (const h of hearts) innerPart.splice(Math.floor(Math.random() * (innerPart.length + 1)), 0, h);
  return outlinePart.concat(innerPart);
}

function startHeart() {
  const queue = heartPlan.queue, outlineCount = heartPlan.outlineCount;
  let i = 0, pink = false;

  // flash the whole heart between red and pink while it builds
  const flasher = setInterval(() => {
    pink = !pink;
    heartScene.style.setProperty("--word-color", pink ? "#ff8fc7" : "#ff1f3d");
  }, FLASH_SPEED);

  function addNext() {
    if (i >= queue.length) {
      clearInterval(flasher);
      heartScene.style.setProperty("--word-color", "#ff1f3d");
      heartScene.classList.add("done");
      return;
    }
    const w = queue[i++];
    const el = document.createElement("span");
    el.className = "word";
    el.textContent = w.text;
    el.style.left = w.x + "px";
    el.style.top = w.y + "px";
    el.style.fontSize = (w.emoji ? w.fs * 1.15 : w.fs) + "px";
    if (w.ls) el.style.letterSpacing = w.ls + "px";
    wrap.appendChild(el);
    setTimeout(addNext, i <= outlineCount ? OUTLINE_DELAY : FILL_DELAY);
  }
  addNext();
}

/* ============================================================
   The click: music starts, screen fades to black, heart begins
   ============================================================ */
let heartPlan = null;
function buildPlan() {
  const all = layoutWords();
  // 1) outline, CLOCKWISE from the top dip: right lobe, down to the tip, up the left side
  const outline = all.filter(w => w.edge).sort((p, q) => p.ang - q.ang);
  // 2) then the body, TOP to BOTTOM (left to right within a row)
  const inner = all.filter(w => !w.edge).sort((p, q) => (p.y - q.y) || (p.x - q.x));
  const queue = outline.concat(inner);
  const final = assignPhrases(queue, all);
  heartPlan = { queue: final, outlineCount: final.filter(w => w.edge).length };
}
let started = false;
function sayYes() {
  if (started) return;
  started = true;

  // music (browsers only allow sound after a click, and this is that click)
  song.src = SONG_FILE;
  song.volume = 0.9;
  song.play().catch(() => { /* no song file yet; the heart still plays */ });

  qScene.classList.add("fade-out");
  heartScene.classList.add("show");
  const intro = document.getElementById("intro");
  buildPlan();
  const first = heartPlan.queue[0];
  const introPx = parseFloat(getComputedStyle(intro).fontSize);
  intro.style.setProperty("--dx", (first.x - window.innerWidth / 2) + "px");
  intro.style.setProperty("--dy", (first.y - window.innerHeight / 2) + "px");
  intro.style.setProperty("--ds", (first.fs / introPx) * 0.9);
  setTimeout(() => intro.classList.add("play"), 900);               // big "I love you" appears, then shrinks...
  setTimeout(() => { intro.style.display = "none"; startHeart(); }, 900 + INTRO_MS);  // ...into the heart's first spot
}
document.getElementById("yes1").addEventListener("click", sayYes);
document.getElementById("yes2").addEventListener("click", sayYes);
</script>
</body>
</html>
